<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lab 9 - Horizontal Slideshow</title>
    <link rel="stylesheet" href="../style.css">
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>

    <style>
        #slideshow {
            width: 100%;
            overflow: hidden;
            margin-top: 20px;
        }

        #results
        {
            display: flex;
            transition: transform 0.4s ease;
        }

        .slide {
            min-width: 100%;
            box-sizing: border-box;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
            
        .book
        {
            border: 1px solid gray;
            width: 18%;
            padding: 8px;
            box-sizing: border-box;
        }

        .book img {
            max-width: 100%;
        }

        #controls {
            margin-top: 15px;
        }

    </style>
</head>

<body>
    <main class="container page-content">
        <section class="directory-panel">
            <h1>Lab 9 - Horizontal Slideshow</h1>

            <input type="text" id="searchTerm" value="web api">
            <button id="btnSearch">Search</button>

            <div id="slideshow">
                <div id="results"></div>
            </div>

            <div id="controls">
                <button id="prev">Previous</button>
                <span id="pageInfo">(0 / 0)</span>
                <button id="next">Next</button>
            </div>

            <p><a href="../index.html">Back to Home</a></p>
        </section>
    </main>

    <script>
    $(document).ready(function ()
    {
        var currentPage = 1;
        var totalPages = 0;
        
        $("#btnSearch").click(function ()
        {
            currentPage = 1;
            totalPages = 0;
            $("#results").empty();
            loadBooks(currentPage);
        });

        $("#next").click(function() {
            if (currentPage < totalPages) {
                currentPage++;
                loadBooks(currentPage);
            }
        });

        $("#prev").click(function() {
            if (currentPage > 1) {
                currentPage--;
                loadBooks(currentPage);
            }
        });

        function loadBooks(page)
        {
            var term = $("#searchTerm").val().trim();

            if (term === "")
            {
                $("#results").html("<p>Please enter a search term.</p>");
                $("#pageInfo").text("(0 / 0)");
                return;
            }

            var url = "https://openlibrary.org/search.json?q=" +
                      encodeURIComponent(term) +
                      "&page=" + page + "&limit=10";

            $.ajax({
                url: url,
                dataType: "json",
                success: function (data)
                {
                    var docs = data.docs || [];
                    totalPages = Math.ceil((data.numFound || 0) / 10);

                    var slide = $("<div class='slide'></div>");

                    $.each(docs, function(index, book)
                    {
                        var title = book.title || "No title";
                        var cover = book.cover_i
                            ? "https://covers.openlibrary.org/b/id/" + book.cover_i + "-M.jpg"
                            : "";

                        var bookDiv = $("<div class='book'>");
                        $("<h3></h3>").text(title).appendTo(bookDiv);

                        if (cover) {
                            $("<img>").attr("src", cover).attr("alt", title).appendTo(bookDiv);
                        }

                        slide.append(bookDiv);
                    });

                    $("#results").empty().append(slide);
                    $("#results").css("transform", "translateX(100%)");

                    setTimeout(function() {
                        $("#results").css("transform", "translateX(0)");
                    }, 20);

                    $("#pageInfo").text("(" + currentPage + " / " + totalPages + ")");
                }
            });
        }
    });
    </script>

</body>
</html>

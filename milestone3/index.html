<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Milestone 3 - Open Library</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>Open Library Book Search</h1>
    <p>Search for books and explore a collections.</p>
  </header>

  <main>
    <section id="searchSection">
      <h2>Search Books</h2>
      <input type="text" id="searchInput" placeholder="Enter a title or keyword">
      <button id ="searchButton">Search</button>
    </section>

    <section id="resultsSection">
      <h2>Search Results</h2>
      <div id="searchResults"></div>
      <div id="pageControls"></div>
    </section>

    <section id="detailsSection">
      <h2>Book Details</h2>
      <div id="bookDetails">
        <p>Select a book to view its details.</p>
      </div>
    </section>
  </main>

  <footer>
    <p>IT 4403 - Milestone 3</p>
  </footer>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Milestone 2 - Book Search</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <nav>
    <a href="index.html">Home</a>
    <a href="bookshelf.html">My Bookshelf</a>
  </nav>

  <div class="container">
    <h1>Open Library - Book Search</h1>
    <div class="search-box">
      <input type="text" id="searchInput"
        placeholder="Enter a book title or keyword">
      <button id="searchButton">Search</button>
  </div>

    <div id="pageControls"></div>
    <div id="searchResults"></div>
  </div>

  <footer>
    <div class="footer-top">
      <h2>CCSE Department of Information Technology</h2>
      <p>This website contains my exercises, labs, and projects completed for my IT4403 - Advanced Web and Mobile Application Class.</p>
    </div>

    <div class="footer-bottom">
      <div class="email-pill">Email</div>
      <p><a href="mailto:evalarin@students.kennesaw.edu">evalarin@students.kennesaw.edu</a></p>

      <p><a href="../index.html">Back to Course Homepage</a></p>
    </div>
  </footer>

  <script>
    const searchInput = document.getElementById("searchInput");
    const searchButton = document.getElementById("searchButton");
    const searchResults = document.getElementById("searchResults");
    const pageControls = document.getElementById("pageControls");
    let currentSearch = "";
    const resultsPerPage = 10;

    function searchBooks(page) {
      const url = `https://openlibrary.org/search.json?q=${encodeURIComponent(currentSearch)}&limit=${resultsPerPage}&page=${page}`;
      const searchTerm = searchInput.value.trim();

      searchResults.textContent = "Searching for books...";
      pageControls.innerHTML = "";

      fetch(url)
        .then(response => {
          if (!response.ok) {
            throw new Error("Unable to retrieve books.");
          }
          return response.json();
        })
        .then(data => {
          if (data.docs.length === 0) {
            searchResults.textContent = "No books found. Try another search.";
            return;
          }

          let html = "";

          data.docs.forEach(book => {
            const cover = book.cover_i
              ? `https://covers.openlibrary.org/b/id/${book.cover_i}-M.jpg`
              : "https://placehold.co/180x250?text=No+Cover";

            const workId = book.key.split("/").pop();

            html += `
              <div class="book">
                <div class="book-cover">
                  <img src="${cover}" alt="${book.title} cover">
                </div>
                <div class="book-info">
                  <h2>
                    <a href="details.html?workId=${workId}">
                      ${book.title}
                    </a>
                  </h2>
                  <p><strong>Author(s):</strong>
                    ${book.author_name ? book.author_name.join(", ") : "Not Available"}
                  </p>
                  <p><strong>First Published:</strong>
                    ${book.first_publish_year || "Not Available"}
                  </p>
                </div>
              </div>
            `;
          });

          searchResults.innerHTML = html;

          const totalPages = Math.min(
            6,
            Math.ceil(data.numFound / resultsPerPage)
          );

          if (totalPages > 1) {
            let options = "";

            for (let i = 1; i <= totalPages; i++) {
              options += `<option value="${i}" ${i === page ? "selected" : ""}>Page ${i}</option>`;
            }

            pageControls.innerHTML = `
              <label for="pageSelect">Select Page: </label>
              <select id="pageSelect">${options}</select>
            `;

            document.getElementById("pageSelect")
              .addEventListener("change", function() {
                searchBooks(Number(this.value));
              });
          }
        })
        .catch(error => {
          searchResults.textContent = "Unable to load books. Please try again.";
          console.log("Error:", error);
        });
    }

    searchButton.addEventListener("click", function() {
      currentSearch = searchInput.value.trim();

      if (currentSearch === "") {
        searchResults.textContent = "Please enter a book title or keyword.";
        pageControls.innerHTML = "";
        return;
      }

      searchBooks(1);
    });
  </script>
</body>
</html>

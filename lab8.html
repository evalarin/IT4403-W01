<!DOCTYPE html>
<html>
<head>
  <title>Lab 8 - Google Books</title>
</head>
<body>

  <h1>Lab 8 - Google Books</h1>

  <input type="text" id="searchInput" placeholder="Enter a book title">
  <button id="searchButton">Search</button>

  <button onClick="changeLayout('list')">List View</button>
  <button onClick="changeLayout('grid')">Grid View</button>
  <button onClick="changeLayout('three')">3 Per Row</button>
  <button onClick="changeLayout('first')">First Item Full Width</button>
  <div id="bookResults"></div>

  <script>
    document.getElementById("searchButton").addEventListener("click", function() {
      let search = document.getElementById("searchInput").value;

      fetch("https://www.googleapis.com/books/v1/volumes?q=" + encodeURIComponent(search) + "&maxResults=8")
        .then(response => response.json())
        .then(data => {
          let results = document.getElementById("bookResults");
          results.innerHTML = "";

          (data.items || []).forEach(book => {
            let info = book.volumeInfo;

            results.innerHTML += `
              <div class="book">
                <h3>${info.title}</h3>
                <p>${(info.authors || []).join(", ")}</p>
                <img src="${info.imageLinks?.thumbnail || ""}" alt="Book cover">
              </div>
            `;
          });
        });
    });

    function changeLayout(layout) {
      document.getElementById("bookResults").className = layout;
    }
  </script>

</body>
</html>

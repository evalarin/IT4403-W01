<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab 8 - Google Books</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html">
        <strong>Elena Valarino</strong>
        <small>IT 4403 · Kennesaw State University</small>
      </a>

      <nav>
        <a href="index.html">HOME</a>
        <a href="exercises.html">EXERCISES</a>
        <a href="labs.html" aria-current="page">LABS</a>
        <a href="projects.html">PROJECTS</a>
      </nav>
    </div>
  </header>

  <main class="container page-content">
    <div class="banner"></div>

    <section class="intro-card">
      <h1>Lab 8: Google Books</h1>
      <p>Searching and displaying books using the Google Books API and CSS Flexbox.</p>
    </section>

    <section class="directory-panel">
      <input type="text" id="searchInput" placeholder="Enter a book title">
      <button id="searchButton">Search</button>

      <button onclick="changeLayout('list')">List View</button>
      <button onclick="changeLayout('grid')">Grid View</button>
      <button onclick="changeLayout('three')">3 Per Row</button>
      <button onclick="changeLayout('first')">First Item Full Width</button>

      <div id="bookResults"></div>

      <script id="bookTemplate" type="x-tmpl-mustache">
        {{#books}}
          <div class="book">
            <h3>{{title}}</h3>
            <p>{{authors}}</p>
            <img src="{{thumbnail}}" alt="Book cover">
          </div>
        {{/books}}
      </script>

      <p><a href="index.html">Back to Home</a></p>
    </section>
  </main>

  <footer class="site-footer">
    <p>Elena Valarino | IT 4403 | Kennesaw State University</p>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/mustache.js/4.2.0/mustache.min.js"></script>
  
  <script>
    document.getElementById("searchButton").addEventListener("click", function() {
      let search = document.getElementById("searchInput").value;

      fetch("https://www.googleapis.com/books/v1/volumes?q=" + encodeURIComponent(search) + "&maxResults=8")
        .then(response => response.json())
        .then(data => {
          let results = document.getElementById("bookResults");
          results.innerHTML = "";

          let books = (data.items || []).map(book => {
            let info = book.volumeInfo;

            return {
              title: info.title,
              authors: (info.authors || []).join(", "),
              thumbnail: info.imageLinks?.thumbnail || ""
          };
        });

        let template = document.getElementById("bookTemplate").innerHTML;
        results.innerHTML = Mustache.render(template, { books: books });
    });

    function changeLayout(layout) {
      document.getElementById("bookResults").className = layout;
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lab 2 - Exercise 6</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>
  <h1>Exercise 6: jQuery Calculator</h1>
  <p> First Number:
    <input type="text" id="num1">
  </p>
  <p>
    Second Number:
    <input type="text" id="num2">
  </p>
  <p>
    Operation:
    <select id="operation">
      <option value="add">Addition</option>
      <option value="subtract">Subtraction</option>
      <option value="multiply">Multiplication</option>
      <option value="divide">Division</option>
    </select>
  </p>
  <p>
    Result Color:
    <input type="text" id="color" placeholder="pink, yellow, purple">
  </p>
  <button id="calculate">Calculate</button>
  <h2 id="result"></h2>
  <script>
    $(document).ready(function() {
      $("#calculate").click(function() {
        var num1 = $("#num1").val();
        var num2 = $("#num2").val();
        var operation = $("#operation").val();
        var color = $("#color").val();
        if (num1 == "" || num2 == "") {
          $("#result").text("Please enter 2 numbers.");
          return;
        }
        if (isNaN(num1) || isNaN(num2)) {
          $("#result").text("Please only enter valid numbers.");
          return;
        }
        num1 = Number(num1);
        num2 = Number(num2);
        var answer;
        if (operation == "add") {
          answer = num1 + num2;
        }
        else if (operation == "subtract") {
          answer = num1 - num2;
        }
        else if (operation == "multiply") {
          answer = num1 * num2;
        }
        else if (operation == "divide") {
          if (num2 == 0) {
            $("#result").text("You cannot divide by zero. Please enter another number.");
            return;
          }
          answer = num1 / num2;
        }
        $("#result").text("Result: " + answer);
        $("#result").css("color", color);
      });
    });
  </script>
  <p><a href="../index.html">Back to Home</a></p>
</body>
</html>

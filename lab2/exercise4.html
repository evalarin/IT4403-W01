<body>
  <h1>Exercise 4: Website Progress</h1>
  <p>This table will show some of the changes I have made to the my website per course guidance.</p>

  <table border="1">
    <tr>
      <th>Website Changes</th>

      <td>Created the Homepage</td>

  <br>
  <button id="hideOdd">Hide the Odd Rows</button>
  <button id="showRows">Restore All Rows</button>

  <script>
    $(document).ready(function() {
      $("tr:odd").css("background-color", "lightblue");
      $("#hideOdd").click(function() {
        $("tr:odd").hide();
      });
      $("#showRows").click(function() {
        $("tr").show();
      });
      $("tr").click(function() {
        $(this).hide();
      });
  </script>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Milestone 4 - Open Library</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://unpkg.com/mustache@4.2.0/mustache.min.js"></script>
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>Open Library Book Search</h1>
    <p>Search for books and explore a collections.</p>
  </header>

  <main>
    <section id="searchSection">
      <h2>Search Books</h2>
      <input type="text" id="searchInput" placeholder="Enter a title or keyword">
      <button id ="searchButton">Search</button>
    </section>

    <section id="resultsSection">
      <h2>Search Results</h2>
      <div id="viewControls">
        <button id="gridViewButton" type="button">Grid View</button>
        <button id="listViewButton" type="button">List View</button>
      </div>
      
      <div id="searchResults"></div>
      <script id="bookTemplate" type="x-tmpl-mustache">
        {{#books}}
        <div class="book-item">
          <a href="#" class="book-link" data-key="{{key}}">
            {{title}}
          </a>
          {{#coverUrl}}
            <img src="{{coverUrl}}" alt="Cover of {{title}}">
          {{/coverUrl}}
          {{^coverUrl}}
            <p>No cover available.</p>
          {{/coverUrl}}
        </div>
          {{/books}}
      </script>
      <div id="pageControls"></div>
    </section>

    <section id="detailsSection">
      <h2>Book Details</h2>
      <div id="bookDetails">
        <p>Select a book to view its details.</p>
      </div>

      <script id="detailsTemplate" type="x-tmpl-mustache">
        <div class="book-details">
          <h3>{{title}}</h3>
          <p><strong>Work ID:</strong> {{key}}</p>
          <p><strong>Author(s):</strong> {{authors}}</p>

          {{#coverUrl}}
            <img src="{{coverUrl}}" alt=Cover of {{title}}">
          {{/coverUrl}}
          {{^coverUrl}}
            <p>No cover available.</p>
          {{/coverUrl}}

          <p><strong>Description:</strong> {{description}}</p>
          <p><strong>Subjects:</strong> {{subjects}}</p>
          <p><strong>First Published:</strong> {{firstPublished}}</p>

          <p>
            <a href="{openLibraryUrl}}" target="_blank" rel="noopener noreferrer">
              View on Open Library
            </a>
          </p>
        </div>
      </script>
    </section>

    <section id="collectionSection">
      <h2>Fantasy Book Collection</h2>
      <div id="bookCollection"></div>
      <script id="collectionTemplate" type="x-tmpl-mustache">
        {{#books}}
        <div class="book-item">
          <a href="#" class="collection-link" data-key="{{key}}">
            {{title}}
          </a>

          {{#coverUrl}}
            <img src="{{coverUrl}}" alt="Cover of {{title}}">
          {{/coverUrl}}

          {{^coverUrl}}
            <p>No cover available.</p>
          {{/coverUrl}}
        </div>
          {{/books}}
      </script>
    </section>
  </main>

  <footer>
    <p>IT 4403 - Milestone 4</p>
  </footer>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Milestone 1 - Book</title>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <style>
    body{
      font-family: Arial, Helvetica, sans-serif;
      background:#f5f7fb;
      margin:40px;
      color:#333;
    }
    .container{
      max-width:900px;
      margin:auto;
    }
    h1{
      text-align:center;
      color:#003366;
    }
    .book{
      display:flex;
      gap:30px;
      background:white;
      padding:25px;
      border-radius:12px;
      box-shadow:0 2px 10px rgba(0,0,0,.15);
      margin-top:30px;
    }
    .book-cover img{
      width:250px;
      border-radius:8px;
    }
    .book-info{
      flex:1;
    }
    .book-info h2{
      color:#003366;
      margin-top:0;
    }
    .book-info p{
      margin:10px 0;
      line-height:1.5;
    }
    a{
      color:#0056b3;
      text-decoration:none;
    }
    a:hover{
      text-decoration:underline;
    }
  
  </style>
</head>

<body>
<div class="container">

  <h1>Open Library - Single Book</h1>
  <div id="bookContainer">

  </div>

</script>
</body>
</html>

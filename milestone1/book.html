<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Milestone 1 - Book</title>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <style>
    body{
      font-family: Arial, Helvetica, sans-serif;
      background:#f5f7fb;
      margin:40px;
      color:#333;
    }
    .container{
      max-width:900px;
      margin:auto;
    }
    h1{
      text-align:center;
      color:#003366;
    }
    .book{
      display:flex;
      align-items:flex-start;
      gap:30px;
      background:white;
      padding:30px;
      border-radius:12px;
      box-shadow:0 2px 10px rgba(0,0,0,.15);
      margin-top:30px;
    }
    .book-cover img{
      width:250px;
      border-radius:8px;
    }
    .book-info{
      flex:1;
      width:100%;
    }
    .book-info h2{
      color:#003366;
      margin-top:0;
    }
    .book-info p{
      margin:12px 0;
      line-height:1.5;
    }
    .book-info strong{
      color:#003366;
    }
    a{
      color:#0056b3;
      text-decoration:none;
    }
    a:hover{
      text-decoration:underline;
    }
    nav{
      margin-bottom:20px;
    }
    nav a{
      color:#003366;
      font-weight:bold;
      text-decoration:none;
    }
    nav a:hover{
      text-decoration:underline;
    }
  </style>
</head>

<body>
<div class="container">
  <nav>
    <a href="../index.html">Back to Home</a>
  </nav>
  <h1>Open Library - Single Book</h1>
  <p>
    <a href="search.html">View Search Results</a>
  </p>
  <div id="bookContainer">

  </div>
<script>

  $(document).ready(function () {
    $.getJSON("openlibrary-book.json", function (book) {
      let cover = "";
      if (book.covers && book.covers.length > 0 && book.covers[0] !== -1) {
        cover = `https://covers.openlibrary.org/b/id/${book.covers[0]}-L.jpg`;
      }
      else{
        cover = "https://placehold.co/250x350?text=No+Cover";
      }
      
      $("#bookContainer").html(`
        <div class="book">
          <div class="book-cover">
            <img src="${cover}" alt="${book.title} Cover">
          </div>
          
          <div class="book-info">
            <h2>${book.title}</h2>
            <p><strong>Publisher:</strong> ${book.publishers ? book.publishers.join(", ") : "Not Available"}</p>
            <p><strong>Publication Date:</strong> ${book.publish_date || "Not Available"}</p>
            <p><strong>Pages:</strong> ${book.number_of_pages || "Not Available"}</p>
            <p><strong>ISBN-10:</strong> ${book.isbn_10 ? book.isbn_10.join(", ") : "Not Available"}</p>
            <p><strong>ISBN-13:</strong> ${book.isbn_13 ? book.isbn_13.join(", ") : "Not Available"}</p>

            <p><strong>First Sentence:</strong>
            ${book.first_sentence ? book.first_sentence.value : "Not Available"}
            </p>
            
            <p><strong>Author Reference:</strong>
            <a href="https://openlibrary.org${book.authors[0].key}" target="_blank">
            ${book.authors[0].key}
            </a>
            </p>

            <p>
            <strong>Open Library Record:</strong><br>

            <a href="https://openlibrary.org${book.key}"
            target="_blank">
            View on Open Library
            </a>
            </p>
          </div>
        </div>
      `);
    }).fail(function () {
      $("#bookContainer").html("<p>Unable to load the JSON file.</p>");
    });
  });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 4 - User Albums</title>
  </head>
  <body>
    <h1>Lab 4: RESTful Web APIs</h1>

    <h2>User Information</h2>
    <div id="userInfo"></div>
    <h2>User Albums</h2>
    <div id="albumList"></div>
    
  </body>
  <p><a href="../index.html">Back to Home</a></p>
  <script>
    fetch("https://jsonplaceholder.typicode.com/users/1")
      .then(response => response.json())
      .then(user => {
        document.getElementById("userInfo").innerHTML = `
          <p><strong>Name:</strong> ${user.name}</p>
          <p><strong>Username:</strong> ${user.username}</p>
          <p><strong>Email:</strong> ${user.email}</p>
          <p><strong>Address:</strong> ${user.address.street}, ${user.address.city}, ${user.address.zipcode}</p>
          <p><strong>Phone:</strong> ${user.phone}</p>
          <p><strong>Website:</strong> ${user.website}</p>
          <p><strong>Company:</strong> ${user.company.name}</p>
        `;
      })
      .catch(error => {
        console.log("Error:", error);
      });

    fetch("https://jsonplaceholder.typicode.com/albums?userId=1")
      .then(response => response.json())
      .then(albums => {
        let albumList = "<ul>";

        albums.forEach(album => {
          albumList += `
            <li>
              <a href="page2.html?albumId=${album.id}">
                ${album.title}
              </a>
            </li>
          `;
        });

        albumList += "</ul>";
        document.getElementById("albumList").innerHTML = albumList;
      })
      .catch(error => {
        console.log("Error:", error);
      });
  </script>
</html>
